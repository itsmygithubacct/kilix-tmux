[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kilix-tmux"
version = "0.1.0"
description = "Socket-explicit tmux CLI and shared control backend"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[project.scripts]
kilix-tmux = "kilix_tmux.__main__:main"

[tool.setuptools.packages.find]
include = ["kilix_tmux*"]
